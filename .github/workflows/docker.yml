name: Container image (Vulkan)

# Builds the Vulkan-enabled image from ./Dockerfile and pushes it to GHCR as
# ghcr.io/<owner>/trellis.cpp:latest on every push to main (plus a :sha-<sha>
# tag so a bad "latest" can always be rolled back to an exact commit).
on:
  push:
    branches: [main]
    # Skip runs that cannot change the image. (assets/ is NOT ignored -- the
    # runtime stage copies it in.)
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "app/**"
      - "install/**"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: build & push (vulkan)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # The image build compiles the vendored ggml submodule, so it must be
      # present in the build context.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # Extra swap as headroom for the fork-heavy Vulkan shader generation (a
      # failed fork() is only warned about and then surfaces as thousands of
      # undefined-reference link errors). The runner already has an active
      # /swapfile, so use our own file and keep the whole step best-effort --
      # the Dockerfile's -j capping is the actual fix, this is only headroom.
      - name: Add swap
        continue-on-error: true
        run: |
          set -x
          if ! swapon --show=NAME --noheadings | grep -qx /mnt/ci-swapfile; then
            sudo rm -f /mnt/ci-swapfile
            # /mnt is the runner's large ephemeral disk.
            sudo fallocate -l 8G /mnt/ci-swapfile \
              || sudo dd if=/dev/zero of=/mnt/ci-swapfile bs=1M count=8192 status=none
            sudo chmod 600 /mnt/ci-swapfile
            sudo mkswap /mnt/ci-swapfile
            sudo swapon /mnt/ci-swapfile
          fi
          swapon --show
          free -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=trellis.cpp (Vulkan)
            org.opencontainers.image.description=trellis.cpp image-to-3D server/CLI built with the GGML Vulkan backend

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan

      - name: Smoke test the pushed image
        env:
          # metadata-action already lowercases the image name; github.repository
          # keeps the owner's original case (Xydane), which docker rejects with
          # "repository name must be lowercase". Reuse the computed tag.
          IMG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          echo "testing $IMG"
          # trellis-cli prints its usage to stderr, so fold stderr in -- otherwise
          # the capture is empty and the check passes without asserting anything.
          # Capture then filter: piping straight into head can SIGPIPE the docker
          # process and trip pipefail.
          out=$(docker run --rm "$IMG" trellis-cli --help 2>&1)
          printf '%s\n' "$out" | head -3
          printf '%s\n' "$out" | grep -q 'usage: trellis-cli'
          # Same for the server binary: it must at least start and print usage.
          docker run --rm "$IMG" trellis-server --help 2>&1 | grep -q 'usage:'
          # No /dev/dri on the runner, so this only asserts that the Vulkan
          # loader and ggml-vulkan resolve (Mesa llvmpipe answers as a software
          # device); it is not a GPU test.
          info=$(docker run --rm "$IMG" vulkaninfo --summary 2>/dev/null)
          printf '%s\n' "$info" | grep -A4 'Devices:'
          # Guard against a runtime image that is missing the ggml libs.
          docker run --rm "$IMG" sh -c 'ldd /opt/trellis/trellis-cli' > /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then
            echo 'ERROR: unresolved shared libraries:'; grep 'not found' /tmp/ldd.txt; exit 1
          fi
          grep -q libggml-vulkan /tmp/ldd.txt \
            || { echo 'ERROR: trellis-cli is not linked against ggml-vulkan'; exit 1; }
          echo 'smoke test OK'
